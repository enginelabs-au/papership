[package]
name = "engine-labs-desktop"
version = "0.1.0"
description = "Papership desktop"
authors = ["Engine Labs"]
edition = "2021"
license = "LicenseRef-Engine-Labs-Proprietary"

[lib]
name = "engine_labs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
keyring = "3"
